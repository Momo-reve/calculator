<!DOCTYPE html>
<html lang="fr">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="icon" href="data:,">
    <title>Calculator</title>
</head>




<body class="bg-orange-100 min-h-screen flex items-center justify-center">

    <article class="calculator text-center bg-teal-900 my-auto rounded-xl p-4 text-3xl w-[400px] min-h-[600px]">
        <div class="screen-container text-right h-37 flex flex-col justify-between p-2 gap-2">
            <p class="small-text text-xl break-words overflow-x-hidden overflow-y-auto "> </p>
            <p class="large-text text-4xl overflow-x-auto overflow-y-hidden whitespace-nowrap"> </p>
        </div>

        <button class="zero">0</button>
        <button class="one">1</button>
        <button class="two">2</button>
        <button class="three">3</button>
        <button class="four">4</button>
        <button class="five">5</button>
        <button class="six">6</button>
        <button class="seven">7</button>
        <button class="eight">8</button>
        <button class="nine">9</button>
        
        <button class="reset text-2xl bg-red-800 text-white">AC</button>
        <button class="delete text-2xl text-white">DEL</button>

        <button class="percent">%</button>
        <button class="divide">/</button>
        <button class="multiply">*</button>
        <button class="sub">-</button>
        <button class="add">+</button>
        <button class="dot">.</button>
        <button class="equal">=</button>

    </article>

    <script src="JS/script.js"></script>
</body>

</html>
